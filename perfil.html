<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi perfil · Exam Rush</title></head>
<body>
  <h1>Mi perfil</h1>
  <p><a href="index.html">Inicio</a> | <a href="tienda.html">Tienda</a> | <a href="ranking.html">Ranking</a></p>
  <p id="mensaje" role="status"></p>
  <section><h2>Datos del jugador</h2><dl id="datos"></dl></section>
  <section><h2>Inventario</h2><ul id="inventario"></ul></section>
  <section><h2>Historial de partidas</h2><ol id="partidas"></ol></section>
  <script>
    const player = JSON.parse(sessionStorage.getItem('jugador') || 'null');
    const message = document.querySelector('#mensaje');
    async function request(url) {
      const response = await fetch(url); const data = await response.json();
      if (!response.ok) throw new Error(data.mensaje || 'No se pudo cargar la información.');
      return data;
    }
    function line(label, value) {
      const term = document.createElement('dt'); term.textContent = label;
      const detail = document.createElement('dd'); detail.textContent = value;
      document.querySelector('#datos').append(term, detail);
    }
    async function load() {
      if (!player) { message.textContent = 'Inicia sesión para consultar tu perfil.'; return; }
      try {
        const [profile, inventory, matches] = await Promise.all([
          request(`/api/v1/jugadores/${player.id}`),
          request(`/api/v1/jugadores/${player.id}/inventario`),
          request(`/api/v1/jugadores/${player.id}/partidas`)
        ]);
        line('Nombre', profile.nombre); line('Email', profile.email); line('Saldo', `${profile.saldo} puntos`);
        const items = document.querySelector('#inventario');
        if (!inventory.length) items.textContent = 'Todavía no tienes objetos.';
        for (const item of inventory) { const li = document.createElement('li'); li.textContent = `${item.nombreObjeto}: ${item.cantidad}`; items.append(li); }
        const history = document.querySelector('#partidas');
        if (!matches.length) history.textContent = 'Todavía no hay partidas.';
        for (const match of matches) {
          const li = document.createElement('li'); li.textContent = `${match.puntuacion} puntos · nota ${match.notaExamen}/10 · ${match.fecha}`; history.append(li);
        }
      } catch (error) { message.textContent = error.message || 'No se pudo conectar con la API.'; }
    }
    load();
  </script>
</body>
</html>
