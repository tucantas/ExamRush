<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro</title></head>
<body>
  <h1>Registro</h1>
  <form id="registro">
    <p><label>Nombre<br><input name="nombre" required maxlength="60"></label></p>
    <p><label>Email<br><input name="email" type="email" required></label></p>
    <p><label>Contraseña (mínimo 6 caracteres)<br><input name="password" type="password" minlength="6" required></label></p>
    <button type="submit">Crear cuenta</button>
  </form>
  <p id="mensaje" role="status"></p>
  <p><a href="login.html">Login</a> | <a href="index.html">Inicio</a></p>
  <script>
    document.querySelector('#registro').addEventListener('submit', async (event) => {
      event.preventDefault();
      const datos = Object.fromEntries(new FormData(event.currentTarget));
      const salida = document.querySelector('#mensaje');
      try {
        const respuesta = await fetch('/api/v1/usuarios/registro', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
        });
        const cuerpo = await respuesta.json();
        if (!respuesta.ok) throw new Error(cuerpo.mensaje || 'No se pudo crear la cuenta.');
        salida.textContent = `Cuenta creada para ${cuerpo.nombre}. Ya puedes iniciar sesión.`;
        event.currentTarget.reset();
      } catch (error) { salida.textContent = error.message || 'No se pudo conectar con la API.'; }
    });
  </script>
</body>
</html>
